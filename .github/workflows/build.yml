name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build extract-assets
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o extract-assets${{ matrix.ext }} ./cmd/extract-assets

      - name: Build blockymerge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o blockymerge${{ matrix.ext }} ./cmd/blockymerge

      - name: Upload extract-assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: extract-assets-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: extract-assets${{ matrix.ext }}
          retention-days: 30

      - name: Upload blockymerge artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockymerge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: blockymerge${{ matrix.ext }}
          retention-days: 30
