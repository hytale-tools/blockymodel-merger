name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build extract-assets
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o extract-assets${{ matrix.ext }} ./cmd/extract-assets

      - name: Build blockymerge
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o blockymerge${{ matrix.ext }} ./cmd/blockymerge

      - name: Upload extract-assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: extract-assets-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: extract-assets${{ matrix.ext }}
          retention-days: 90

      - name: Upload blockymerge artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockymerge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: blockymerge${{ matrix.ext }}
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p release
          
          for extract_dir in artifacts/extract-assets-*/; do
            if [ -d "$extract_dir" ]; then
              full_name=$(basename "$extract_dir")
              platform=$(echo "$full_name" | sed 's/^extract-assets-//' | sed 's/\.exe$//')
              
              mkdir -p "release-temp/$platform"
              
              # Copy all files from extract-assets directory (try with and without .exe)
              for artifact_dir in "artifacts/extract-assets-$platform.exe" "artifacts/extract-assets-$platform"; do
                if [ -d "$artifact_dir" ]; then
                  cp "$artifact_dir"* "release-temp/$platform/" 2>/dev/null || true
                  break
                fi
              done
              
              # Copy all files from blockymerge directory (try with and without .exe)
              for artifact_dir in "artifacts/blockymerge-$platform.exe" "artifacts/blockymerge-$platform"; do
                if [ -d "$artifact_dir" ]; then
                  cp "$artifact_dir"* "release-temp/$platform/" 2>/dev/null || true
                  break
                fi
              done
              
              # Create archive
              if [[ "$platform" == *"windows"* ]]; then
                (cd "release-temp/$platform" && zip -r "../../release/blockymodel-merger-$platform.zip" .)
              else
                (cd "release-temp/$platform" && tar -czf "../../release/blockymodel-merger-$platform.tar.gz" .)
              fi
            fi
          done
          
          rm -rf release-temp

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
